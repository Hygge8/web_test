name: iOS Build and Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for simulator
        run: >-
          xcodebuild
          -project HealthMi.xcodeproj
          -scheme HealthMi
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Run unit tests
        run: >-
          xcodebuild
          -project HealthMi.xcodeproj
          -scheme HealthMi
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro'
          CODE_SIGNING_ALLOWED=NO
          test

      - name: Build unsigned iPhone app
        run: >-
          xcodebuild
          -project HealthMi.xcodeproj
          -scheme HealthMi
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/HealthMi.app build/Payload/
          cd build
          ditto -c -k --sequesterRsrc --keepParent Payload HealthMi-Sleep-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: HealthMi-Sleep-unsigned-IPA
          path: build/HealthMi-Sleep-unsigned.ipa
          if-no-files-found: error
